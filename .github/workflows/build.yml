name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # runner 自带 Android SDK，不用 android-actions/setup-android
      # （那个 action 会去装已被移除的 'tools' 包，直接失败）
      - name: 安装 SDK 组件
        run: |
          set -e
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: 还原素材（从上游 dsh-pet 转码）
        run: |
          sudo ln -sf "$(which ffmpeg)" /usr/local/bin/ffmpeg
          chmod +x tools/fetch-and-transcode.sh
          ./tools/fetch-and-transcode.sh

      - name: 构建 debug APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: desk-pet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
